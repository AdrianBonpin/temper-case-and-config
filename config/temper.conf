# NICE OLED Config
## GEM animation on peripheral half (was CONFIG_NICE_OLED_GEM_ANIMATION)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
## CAT is default y; disable so GEM shows
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
## 2x slower, 30fps (was CONFIG_NICE_OLED_GEM_ANIMATION_MS)
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=1920

## set max to 150 (was CONFIG_NICE_OLED_GEM_WPM_FIXED_RANGE_MAX)
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE_MAX=150

## Central widgets all off (defaults are y in the module)
CONFIG_NICE_OLED_WIDGET_WPM=n
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n