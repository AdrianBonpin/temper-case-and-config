manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
      # Savior
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      # zmk-nice-oled is tested against ZMK v0.3.0 (LVGL 8);
      # ZMK main uses LVGL 9.3 which the module does not support yet.
      import: app/west.yml
      # OLED Adapter
    - name: zmk-oled-adapter
      remote: mctechnology17
      revision: main
      # nice_oled
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
  self:
    path: config
